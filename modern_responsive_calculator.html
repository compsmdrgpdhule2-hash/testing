<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Responsive Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        calculator: {
                            bgLight: '#f3f4f6',
                            bgDark: '#0f172a',
                            surfaceLight: '#ffffff',
                            surfaceDark: '#1e293b',
                            displayLight: '#f8fafc',
                            displayDark: '#0f172a',
                            accent: '#6366f1',
                            accentHover: '#4f46e5',
                            opLight: '#e0e7ff',
                            opDark: '#312e81',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        /* Custom subtle glassmorphism effect */
        .glass {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Active button scale animation */
        .btn-active {
            transform: scale(0.94);
        }

        /* Hide scrollbars for display but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-calculator-bgLight dark:bg-calculator-bgDark text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <!-- Calculator Container -->
    <div class="w-full max-w-md bg-calculator-surfaceLight dark:bg-calculator-surfaceDark rounded-3xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800 transition-all duration-300">
        
        <!-- Header / Toolbar -->
        <div class="flex justify-between items-center px-6 pt-5 pb-2">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
            </div>
            
            <div class="flex items-center space-x-3">
                <!-- History Toggle Button -->
                <button id="historyBtn" title="Toggle History" class="p-2 rounded-xl text-slate-500 hover:text-indigo-600 dark:text-slate-400 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                    <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                </button>
                
                <!-- Theme Toggle Button -->
                <button id="themeBtn" title="Toggle Theme" class="p-2 rounded-xl text-slate-500 hover:text-indigo-600 dark:text-slate-400 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                    <i id="themeIcon" class="fa-solid fa-sun text-lg"></i>
                </button>
            </div>
        </div>

        <!-- History Panel (Collapsible Overlay) -->
        <div id="historyPanel" class="hidden relative px-6 py-3 bg-slate-100/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800 max-h-48 overflow-y-auto no-scrollbar transition-all">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Calculation History</span>
                <button id="clearHistoryBtn" class="text-xs text-red-500 hover:underline">Clear History</button>
            </div>
            <div id="historyList" class="space-y-2 text-sm text-right">
                <div class="text-slate-400 text-center py-2 text-xs">No history available</div>
            </div>
        </div>

        <!-- Calculator Display Section -->
        <div class="px-6 py-4 flex flex-col justify-end items-end min-h-[140px] bg-calculator-displayLight dark:bg-calculator-displayDark border-b border-slate-100 dark:border-slate-800/50">
            <!-- Expression Display (Upper line) -->
            <div id="expressionDisplay" class="text-slate-400 dark:text-slate-500 text-sm font-medium h-6 overflow-x-auto w-full text-right no-scrollbar whitespace-nowrap">
                <!-- Expression shows here -->
            </div>
            <!-- Main Result / Input Display -->
            <div id="mainDisplay" class="text-4xl md:text-5xl font-bold text-slate-800 dark:text-slate-100 w-full text-right overflow-x-auto no-scrollbar whitespace-nowrap tracking-tight transition-all">
                0
            </div>
        </div>

        <!-- Memory Buttons Row -->
        <div class="grid grid-cols-4 gap-2 px-6 pt-4 pb-2 text-xs font-semibold">
            <button data-action="mc" class="mem-btn py-1.5 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">MC</button>
            <button data-action="mr" class="mem-btn py-1.5 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">MR</button>
            <button data-action="m-plus" class="mem-btn py-1.5 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">M+</button>
            <button data-action="m-minus" class="mem-btn py-1.5 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">M-</button>
        </div>

        <!-- Keypad Grid -->
        <div class="grid grid-cols-4 gap-3 p-6 pt-2">
            <!-- Row 1 -->
            <button data-action="clear" class="btn text-red-500 dark:text-red-400 bg-red-50 dark:bg-red-950/30 hover:bg-red-100 dark:hover:bg-red-900/40 text-lg font-semibold py-4 rounded-2xl transition-all active:scale-95">AC</button>
            <button data-action="delete" class="btn text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-slate-800 hover:bg-indigo-100 dark:hover:bg-slate-700 text-lg font-semibold py-4 rounded-2xl transition-all active:scale-95">
                <i class="fa-solid fa-backspace"></i>
            </button>
            <button data-action="percent" class="btn text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-slate-800 hover:bg-indigo-100 dark:hover:bg-slate-700 text-lg font-semibold py-4 rounded-2xl transition-all active:scale-95">%</button>
            <button data-action="operator" data-value="/" class="btn text-indigo-600 dark:text-indigo-300 bg-calculator-opLight dark:bg-calculator-opDark hover:bg-indigo-200 dark:hover:bg-indigo-900 text-xl font-bold py-4 rounded-2xl transition-all active:scale-95">÷</button>

            <!-- Row 2 -->
            <button data-action="number" data-value="7" class="btn bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-xl font-medium py-4 rounded-2xl transition-all active:scale-95">7</button>
            <button data-action="number" data-value="8" class="btn bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-xl font-medium py-4 rounded-2xl transition-all active:scale-95">8</button>
            <button data-action="number" data-value="9" class="btn bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-xl font-medium py-4 rounded-2xl transition-all active:scale-95">9</button>
            <button data-action="operator" data-value="*" class="btn text-indigo-600 dark:text-indigo-300 bg-calculator-opLight dark:bg-calculator-opDark hover:bg-indigo-200 dark:hover:bg-indigo-900 text-xl font-bold py-4 rounded-2xl transition-all active:scale-95">×</button>

            <!-- Row 3 -->
            <button data-action="number" data-value="4" class="btn bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-xl font-medium py-4 rounded-2xl transition-all active:scale-95">4</button>
            <button data-action="number" data-value="5" class="btn bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-xl font-medium py-4 rounded-2xl transition-all active:scale-95">5</button>
            <button data-action="number" data-value="6" class="btn bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-xl font-medium py-4 rounded-2xl transition-all active:scale-95">6</button>
            <button data-action="operator" data-value="-" class="btn text-indigo-600 dark:text-indigo-300 bg-calculator-opLight dark:bg-calculator-opDark hover:bg-indigo-200 dark:hover:bg-indigo-900 text-xl font-bold py-4 rounded-2xl transition-all active:scale-95">−</button>

            <!-- Row 4 -->
            <button data-action="number" data-value="1" class="btn bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-xl font-medium py-4 rounded-2xl transition-all active:scale-95">1</button>
            <button data-action="number" data-value="2" class="btn bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-xl font-medium py-4 rounded-2xl transition-all active:scale-95">2</button>
            <button data-action="number" data-value="3" class="btn bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-xl font-medium py-4 rounded-2xl transition-all active:scale-95">3</button>
            <button data-action="operator" data-value="+" class="btn text-indigo-600 dark:text-indigo-300 bg-calculator-opLight dark:bg-calculator-opDark hover:bg-indigo-200 dark:hover:bg-indigo-900 text-xl font-bold py-4 rounded-2xl transition-all active:scale-95">+</button>

            <!-- Row 5 -->
            <button data-action="negate" class="btn bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-lg font-medium py-4 rounded-2xl transition-all active:scale-95">⁺/₋</button>
            <button data-action="number" data-value="0" class="btn bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-xl font-medium py-4 rounded-2xl transition-all active:scale-95">0</button>
            <button data-action="decimal" class="btn bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-xl font-bold py-4 rounded-2xl transition-all active:scale-95">.</button>
            <button data-action="calculate" class="btn bg-indigo-600 hover:bg-indigo-700 text-white text-2xl font-bold py-4 rounded-2xl shadow-lg shadow-indigo-500/30 transition-all active:scale-95">=</button>
        </div>
        
        <!-- Footer Info -->
        <div class="px-6 pb-4 text-center text-xs text-slate-400 dark:text-slate-500">
            Supports keyboard input
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // State Management
        let currentInput = '0';
        let previousInput = '';
        let operation = null;
        let shouldResetDisplay = false;
        let memoryValue = 0;
        let history = [];

        // DOM Element References
        const mainDisplay = document.getElementById('mainDisplay');
        const expressionDisplay = document.getElementById('expressionDisplay');
        const historyPanel = document.getElementById('historyPanel');
        const historyList = document.getElementById('historyList');
        const historyBtn = document.getElementById('historyBtn');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = document.getElementById('themeIcon');

        // Theme Toggle Functionality
        themeBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            themeIcon.className = isDark ? 'fa-solid fa-sun text-lg' : 'fa-solid fa-moon text-lg';
        });

        // Toggle History Panel
        historyBtn.addEventListener('click', () => {
            historyPanel.classList.toggle('hidden');
        });

        // Clear History
        clearHistoryBtn.addEventListener('click', () => {
            history = [];
            renderHistory();
        });

        // Render Calculation History
        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="text-slate-400 text-center py-2 text-xs">No history available</div>';
                return;
            }
            historyList.innerHTML = history.map((item, index) => `
                <div class="py-1 border-b border-slate-200 dark:border-slate-800 last:border-0 cursor-pointer hover:text-indigo-500 transition-colors" onclick="loadHistoryItem(${index})">
                    <div class="text-xs text-slate-400">${item.expression} =</div>
                    <div class="font-semibold text-slate-700 dark:text-slate-200">${item.result}</div>
                </div>
            `).join('');
        }

        // Load item from history back into calculator
        window.loadHistoryItem = function(index) {
            const item = history[index];
            currentInput = String(item.result);
            previousInput = '';
            operation = null;
            updateDisplay();
            historyPanel.classList.add('hidden');
        };

        // Update Screen Displays
        function updateDisplay() {
            // Main Display
            mainDisplay.textContent = formatNumber(currentInput);

            // Dynamic Font Resizing for long numbers
            if (currentInput.length > 12) {
                mainDisplay.className = "text-2xl font-bold text-slate-800 dark:text-slate-100 w-full text-right overflow-x-auto no-scrollbar whitespace-nowrap tracking-tight transition-all";
            } else if (currentInput.length > 8) {
                mainDisplay.className = "text-3xl md:text-4xl font-bold text-slate-800 dark:text-slate-100 w-full text-right overflow-x-auto no-scrollbar whitespace-nowrap tracking-tight transition-all";
            } else {
                mainDisplay.className = "text-4xl md:text-5xl font-bold text-slate-800 dark:text-slate-100 w-full text-right overflow-x-auto no-scrollbar whitespace-nowrap tracking-tight transition-all";
            }

            // Expression Display
            if (operation !== null) {
                const opSymbol = getOperatorSymbol(operation);
                expressionDisplay.textContent = `${formatNumber(previousInput)} ${opSymbol}`;
            } else {
                expressionDisplay.textContent = '';
            }
        }

        // Helper to format numbers with commas for display
        function formatNumber(numStr) {
            if (numStr === 'Error' || numStr === 'NaN' || numStr === 'Infinity') return numStr;
            const parts = numStr.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return parts.join('.');
        }

        // Operator Symbols mapping
        function getOperatorSymbol(op) {
            switch(op) {
                case '+': return '+';
                case '-': return '−';
                case '*': return '×';
                case '/': return '÷';
                default: return '';
            }
        }

        // Core Calculation Handler
        function appendNumber(number) {
            if (currentInput === '0' || shouldResetDisplay) {
                currentInput = number;
                shouldResetDisplay = false;
            } else {
                if (currentInput.length < 16) { // Max digits limit
                    currentInput += number;
                }
            }
            updateDisplay();
        }

        function appendDecimal() {
            if (shouldResetDisplay) {
                currentInput = '0.';
                shouldResetDisplay = false;
            } else if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            updateDisplay();
        }

        function handleOperator(op) {
            if (operation !== null && !shouldResetDisplay) {
                calculate();
            }
            previousInput = currentInput;
            operation = op;
            shouldResetDisplay = true;
            updateDisplay();
        }

        function calculate() {
            if (operation === null || shouldResetDisplay) return;

            let result = 0;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        currentInput = 'Error';
                        operation = null;
                        previousInput = '';
                        shouldResetDisplay = true;
                        updateDisplay();
                        return;
                    }
                    result = prev / current;
                    break;
                default:
                    return;
            }

            // Precision adjustment for floating point math errors
            result = Math.round(result * 1e10) / 1e10;

            const exprStr = `${formatNumber(previousInput)} ${getOperatorSymbol(operation)} ${formatNumber(currentInput)}`;
            
            // Add to history
            history.unshift({
                expression: exprStr,
                result: result
            });
            if (history.length > 20) history.pop(); // Keep last 20 records
            renderHistory();

            currentInput = String(result);
            operation = null;
            previousInput = '';
            shouldResetDisplay = true;
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            operation = null;
            shouldResetDisplay = false;
            updateDisplay();
        }

        function deleteLastDigit() {
            if (shouldResetDisplay) return;
            if (currentInput.length === 1 || (currentInput.length === 2 && currentInput.startsWith('-'))) {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        function handlePercentage() {
            const current = parseFloat(currentInput);
            if (isNaN(current)) return;
            currentInput = String(current / 100);
            updateDisplay();
        }

        function toggleNegate() {
            const current = parseFloat(currentInput);
            if (isNaN(current) || current === 0) return;
            currentInput = String(current * -1);
            updateDisplay();
        }

        // Memory Functions
        function handleMemory(action) {
            const current = parseFloat(currentInput);
            switch(action) {
                case 'mc':
                    memoryValue = 0;
                    break;
                case 'mr':
                    currentInput = String(memoryValue);
                    shouldResetDisplay = true;
                    updateDisplay();
                    break;
                case 'm-plus':
                    if (!isNaN(current)) memoryValue += current;
                    break;
                case 'm-minus':
                    if (!isNaN(current)) memoryValue -= current;
                    break;
            }
        }

        // Event Listener Delegation for Buttons
        document.querySelectorAll('button[data-action]').forEach(button => {
            button.addEventListener('click', () => {
                const action = button.dataset.action;
                const value = button.dataset.value;

                switch (action) {
                    case 'number':
                        appendNumber(value);
                        break;
                    case 'decimal':
                        appendDecimal();
                        break;
                    case 'operator':
                        handleOperator(value);
                        break;
                    case 'calculate':
                        calculate();
                        break;
                    case 'clear':
                        clearAll();
                        break;
                    case 'delete':
                        deleteLastDigit();
                        break;
                    case 'percent':
                        handlePercentage();
                        break;
                    case 'negate':
                        toggleNegate();
                        break;
                    case 'mc':
                    case 'mr':
                    case 'm-plus':
                    case 'm-minus':
                        handleMemory(action);
                        break;
                }
            });
        });

        // Physical Keyboard Support
        window.addEventListener('keydown', (e) => {
            // Prevent default page scroll for space and standard keybindings
            if (['/', '*', '+', '-', 'Enter', 'Escape'].includes(e.key)) {
                e.preventDefault();
            }

            if (e.key >= '0' && e.key <= '9') {
                appendNumber(e.key);
            } else if (e.key === '.') {
                appendDecimal();
            } else if (['+', '-', '*', '/'].includes(e.key)) {
                handleOperator(e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                calculate();
            } else if (e.key === 'Backspace') {
                deleteLastDigit();
            } else if (e.key === 'Escape') {
                clearAll();
            } else if (e.key === '%') {
                handlePercentage();
            }
        });

        // Initial Display Render
        updateDisplay();
    </script>
</body>
</html>
